plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'java-library'
    id "com.gradleup.nmcp" version "0.0.8"
}

group = 'cn.afternode.commons'
version = '2.9.0-SNAPSHOT'

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "java"
    apply plugin: "signing"
    apply plugin: "java-library"

    group = parent.group
    version = parent.version

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            mavenJava (MavenPublication) {
                group project.group
                artifactId project.name
                version project.version
                from components.java

                pom {
                    name = "AFterNode Commons"
                    description = "Utilities for Minecraft bukkit plugin (and more) developing"
                    url = "https://github.com/AFterNode/afternode-commons"

                    licenses {
                        license {
                            name = "MIT License"
                            url = "https://github.com/AFterNode/afternode-commons/blob/main/LICENSE"
                        }
                    }

                    developers {
                        developer {
                            id = "h3xadecimal"
                            name = "H3xadecimal"
                            email = "h3xadecimal@afternode.cn"
                        }
                    }

                    scm {
                        url = "https://github.com/AFterNode/afternode-commons"
                    }
                }
            }
        }

        repositories {
            if (((String) project.version).endsWith("-SNAPSHOT")) {
                maven {
                    name = "CentralSnapshots"
                    url = "https://central.sonatype.com/repository/maven-snapshots/"
                    credentials {
                        username = project.hasProperty("centralUsername") ? project.centralUsername : "NONE"
                        password = project.hasProperty("centralPassword") ? project.centralPassword : "NONE"
                    }
                }
            }
        }
    }

    artifacts {
        archives javadocJar, sourcesJar
    }

    signing {
        sign publishing.publications.mavenJava
    }
}

nmcp {
    publishAllProjectsProbablyBreakingProjectIsolation {
        username = project.hasProperty("centralUsername") ? project.centralUsername : "NONE"
        password = project.hasProperty("centralPassword") ? project.centralPassword : "NONE"

        // or if you want to publish automatically
        publicationType = "AUTOMATIC"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
