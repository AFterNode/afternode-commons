import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20' apply false

    id "com.vanniktech.maven.publish" version "0.31.0"
}

group = 'cn.afternode.commons'
version = '2.10.0-SNAPSHOT'

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "java"
    apply plugin: "signing"
    apply plugin: "java-library"
    apply plugin: "com.vanniktech.maven.publish"

    group = parent.group
    version = parent.version

    java {
        withSourcesJar()
        withJavadocJar()
    }

    artifacts {
        archives javadocJar, sourcesJar
    }

    mavenPublishing {
        publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
        signAllPublications()

        coordinates((String) rootProject.group, (String) rootProject.name, (String) rootProject.version)
        pom {
            name = "AFterNode Commons"
            description = "Utilities for Minecraft bukkit plugin (and more) developing"
            url = "https://github.com/AFterNode/afternode-commons"

            licenses {
                license {
                    name = "MIT License"
                    url = "https://github.com/AFterNode/afternode-commons/blob/main/LICENSE"
                }
            }

            developers {
                developer {
                    id = "h3xadecimal"
                    name = "H3xadecimal"
                    email = "h3xadecimal@afternode.cn"
                }
            }

            scm {
                url = "https://github.com/AFterNode/afternode-commons"
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
